<!-- stat-card.component.html -->
<div class="stat-card p-3 rounded shadow-sm d-flex align-items-center justify-content-between">
  <div class="stat-info">
    <h6 class="stat-title text-secondary">{{ title }}</h6>
    <h2 class="stat-value text-dark">{{ value }}</h2>
  </div>
  <div class="stat-icon">
    <i class="bi" [ngClass]="icon" style="font-size: 2rem; color: #6c757d;"></i>
  </div>
</div>
