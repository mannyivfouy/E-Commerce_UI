<div class="sidebar modern-sidebar d-flex flex-column">
  <div class="logo text-center mt-2 mb-3">
    <img src="assets/images/logo.png" />
  </div>

  <div class="sidebar-menu-wrapper">
    <div class="active-bg"></div>

    <ul class="nav flex-column gap-2 flex-grow-1 px-2 sidebar-menu">
      <li>
        <a
          routerLink="/admin/dashboard"
          routerLinkActive="active"
          class="nav-link"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <i class="bi bi-grid-fill me-2"></i> Dashboard
        </a>
      </li>

      <li>
        <a
          routerLink="/admin/users"
          routerLinkActive="active"
          class="nav-link"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <i class="bi bi-people-fill me-2"></i> Users
        </a>
      </li>

      <li>
        <a
          routerLink="/admin/products"
          routerLinkActive="active"
          class="nav-link"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <i class="bi bi-box-fill me-2"></i> Products
        </a>
      </li>

      <li>
        <a
          routerLink="/admin/categories"
          routerLinkActive="active"
          class="nav-link"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <i class="bi bi-tag-fill me-2"></i> Categories
        </a>
      </li>

      <li>
        <a
          routerLink="/admin/orders"
          routerLinkActive="active"
          class="nav-link"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <i class="bi bi-clipboard-check-fill me-2"></i> Orders
        </a>
      </li>
    </ul>
  </div>

  <div class="p-2 mt-auto">
    <a (click)="logout()" class="nav-link logout">
      <i class="bi bi-sign-turn-left-fill me-2"></i> Logout
    </a>
  </div>
</div>
