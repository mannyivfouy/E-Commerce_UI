<div class="row" *ngIf="stats">

  <div class="col-md-4">
    <app-stat-card
      title="Total Users"
      [value]="stats.totalUsers"
      color="primary">
    </app-stat-card>
  </div>

  <div class="col-md-4">
    <app-stat-card
      title="Products"
      [value]="stats.totalProducts"
      color="success">
    </app-stat-card>
  </div>

  <div class="col-md-4">
    <app-stat-card
      title="Categories"
      [value]="stats.totalCategories"
      color="warning">
    </app-stat-card>
  </div>

</div>
