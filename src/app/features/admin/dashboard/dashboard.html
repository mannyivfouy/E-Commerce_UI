<div class="card shadow-sm animate__animated animate__fadeIn p-4">
  <div class="row g-3 " *ngIf="stats">

  <div class="col-md-4">
    <app-stat-card
      title="Total Users"
      [value]="stats.totalUsers"
      icon="bi-people-fill">
    </app-stat-card>
  </div>

  <div class="col-md-4">
    <app-stat-card
      title="Total Products"
      [value]="stats.totalProducts"
      icon="bi-box-fill">
    </app-stat-card>
  </div>

  <div class="col-md-4">
    <app-stat-card
      title="Total Categories"
      [value]="stats.totalCategories"
      icon="bi-tag">
    </app-stat-card>
  </div>

</div>
</div>
