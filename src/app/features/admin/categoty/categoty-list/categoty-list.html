<div class="card shadow-sm animate__animated animate__fadeIn">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h5 class="mb-0">Category List</h5>

    <app-search (searchChange)="onSearch($event)"></app-search>
    <button class="btn btn-primary">
      <i class="bi bi-tag-fill me-2"></i> Add Category
    </button>
  </div>

  <div class="card-body">
    <div *ngIf="loading" class="text-center">Loading...</div>
    <table class="table table-hover" *ngIf="!loading">
      <thead class="table-light text">
        <tr>
          <th>#</th>
          <th>Category Name</th>
          <th>Description</th>
          <th>Status</th>
          <th>Created</th>
          <th>Updated</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody>
        <tr
          *ngFor="let category of filteredCategory; let i = index"
          class="animate__animated animate__fadeInUp"
          [ngStyle]="{'animation-delay': i * 0.1 + 's'}"
        >
          <td>{{i + 1}}</td>
          <td>{{category.categoryName}}</td>
          <td>{{category.description}}</td>
          <td>
            <span class="badge" [ngClass]="category.status ? 'bg-success' : 'bg-secondary'">
              {{category.status ? 'Active' : 'Inactive'}}
            </span>
          </td>
          <td>{{category.createdAt | date: 'short'}}</td>
          <td>{{category.updatedAt | date: 'short'}}</td>
          <td>
            <button class="btn btn-sm btn-warning me-3">
              <i class="bi bi-pencil-fill me-2"></i> Edit
            </button>

            <button class="btn btn-sm btn-danger">
              <i class="bi bi-trash-fill me-2"></i> Delete
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <div *ngIf="!loading && filteredCategory.length === 0" class="text-center text-danger">
      No Category Found
    </div>
  </div>

  <div class="d-flex justify-content-end me-3">
    <app-pagination
    [totalItems]="filteredCategory.length"
    [pageSize]="pageSize"
    [currentPage]="currentPage"
    (pageChange)="onPageChange($event)"
    ></app-pagination>
  </div>
</div>
